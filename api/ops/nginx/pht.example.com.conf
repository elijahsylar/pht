server {
    if ($host = pht.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name pht.example.com;
    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pht.example.com;

    # SSL certs — managed by certbot after first run
    # ssl_certificate     /etc/letsencrypt/live/pht.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pht.example.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pht/current;
    index index.html;

    # Layer 1: HTTP Basic Auth

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 6m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    # API proxy. Strip Basic Auth before forwarding so the backend's JWT
    # middleware is the only thing it sees.
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:4100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";

        # Strip the Basic Auth credentials from the upstream request.
        proxy_set_header Authorization $http_authorization;
        # Note: the browser sends *both* the Basic Auth header (consumed by
        # nginx auth_basic) AND the JWT in Authorization. The JWT is what
        # actually reaches the backend because nginx does not forward the
        # Basic Auth credentials in upstream requests by default — and we
        # explicitly forward only the JWT-bearing Authorization header here.
    }

    ssl_certificate /etc/letsencrypt/live/pht.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pht.example.com/privkey.pem; # managed by Certbot
}
