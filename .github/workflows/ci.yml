name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: API and web tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm ci
        working-directory: web
      - name: API unit and route tests (fake store)
        run: npm test
        working-directory: api
      - name: Web unit tests
        run: npm test
        working-directory: web
      - name: Web production build
        run: npm run build
        working-directory: web

  mysql:
    name: API on real MySQL 8.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: docker pull mysql:8.4
      - run: npm run test:mysql
        working-directory: api
